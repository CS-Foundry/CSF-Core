name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Release Please
    uses: ./.github/release/release-please.yml
    with:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    needs: release-please
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: v
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "version=${{ needs.release-please.outputs.version }}" >> $GITHUB_OUTPUT
          else
            BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            COUNT=$(git rev-list --count HEAD)
            echo "version=${BASE}-alpha.${COUNT}" >> $GITHUB_OUTPUT
          fi

  build-binaries:
    name: Build Binaries
    needs: resolve-version
    uses: ./.github/release/build-binaries.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  build-cp:
    name: Build Control Plane
    needs: resolve-version
    uses: ./.github/release/build-cp.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  build-frontend:
    name: Build Frontend
    needs: resolve-version
    uses: ./.github/release/build-frontend.yml

  publish:
    name: Publish
    needs: [release-please, resolve-version, build-binaries, build-cp, build-frontend]
    uses: ./.github/release/publish.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      prerelease: ${{ needs.release-please.outputs.release_created != 'true' }}
    permissions:
      contents: write

  update-infra:
    name: Update Infra
    needs: [release-please, resolve-version, build-binaries, build-cp, build-frontend, publish]
    uses: ./.github/release/update-infra.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      infra_ref: main
    secrets:
      infra_token: ${{ secrets.INFRA_REPO_TOKEN }}
