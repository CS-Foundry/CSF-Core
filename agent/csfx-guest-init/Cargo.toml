[package]
name = "csfx-guest-init"
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "csfx-guest-init"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "net", "sync"] }
tokio-vsock = "0.7"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
nix = { version = "0.31", features = ["term", "process", "signal", "mount", "reboot", "socket", "sched", "mman", "resource", "dir", "hostname", "personality"] }
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
libcontainer = { version = "0.7", default-features = false, features = ["v2"] }
oci-spec = "0.9"
